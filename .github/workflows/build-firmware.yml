name: Build CYD firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test verified NHL PP timeline and independent pulled-goalie indicators
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_pp_evidence.cpp -o /tmp/glowdeck-nhl-pp-evidence
          /tmp/glowdeck-nhl-pp-evidence
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_penalty_ledger.cpp -o /tmp/glowdeck-penalty-ledger
          /tmp/glowdeck-penalty-ledger
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_on_ice.cpp -o /tmp/glowdeck-on-ice
          /tmp/glowdeck-on-ice
      - name: Test local calendar rollover
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_day_rollover.cpp -o /tmp/glowdeck-day-test
          /tmp/glowdeck-day-test
      - name: Test rear RGB LED patterns and active-low PWM
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_rear_led.cpp -o /tmp/glowdeck-rear-test
          /tmp/glowdeck-rear-test
      - name: Test NHL team palette and independent color diagnostic selection
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_team_palette.cpp -o /tmp/glowdeck-team-palette-test
          /tmp/glowdeck-team-palette-test
      - name: Test NHL scoreboard priority polling cadence
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_poll_cadence.cpp -o /tmp/glowdeck-poll-test
          /tmp/glowdeck-poll-test
      - name: Test conference records and pregame-to-live switching
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_conference_records.cpp -o /tmp/glowdeck-conference-test
          /tmp/glowdeck-conference-test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_detail_mode.cpp -o /tmp/glowdeck-detail-test
          /tmp/glowdeck-detail-test
      - name: Test NHL partial-input retry and backoff
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_fetch_policy.cpp -o /tmp/glowdeck-nhl-fetch-test
          /tmp/glowdeck-nhl-fetch-test
      - name: Test standings carousel ranks and slide order
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_standings_carousel.cpp -o /tmp/glowdeck-standings-test
          /tmp/glowdeck-standings-test
      - name: Test WLED celebration event masks, phases and NHL transitions
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_celebration_engine.cpp -o /tmp/glowdeck-celebration-test
          /tmp/glowdeck-celebration-test
      - name: Validate embedded web dashboard JavaScript
        run: python tests/check_web_ui.py
      - name: Test CYD team-color gradient and RGB565 display bounds
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_team_gradient.cpp -o /tmp/glowdeck-gradient-test
          /tmp/glowdeck-gradient-test
      - name: Test bounded NHL event log and WLED delivery outcomes
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_game_event_log.cpp -o /tmp/glowdeck-game-event-test
          /tmp/glowdeck-game-event-test
      - name: Test stable power-play event history
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_power_play_log_policy.cpp -o /tmp/glowdeck-pp-event-test
          /tmp/glowdeck-pp-event-test
      - name: Test all-live event admission, favorite teams and notification throttling
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_display_event_policy.cpp -o /tmp/glowdeck-display-policy
          /tmp/glowdeck-display-policy
      - name: Test nonblocking NHL event overlay queue and priority
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_event_overlay.cpp -o /tmp/glowdeck-overlay-test
          /tmp/glowdeck-overlay-test
      - name: Test live-first carousel and four-game summary grouping
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_live_carousel.cpp -o /tmp/glowdeck-live-carousel-test
          /tmp/glowdeck-live-carousel-test
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Install logo build dependencies
        run: pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Generate embedded NHL team logos
        run: python scripts/generate_logos.py
      - name: Compile ESP32 CYD firmware
        run: pio run -e cyd
      - name: Publish installable firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glowdeck-gameday-cyd-firmware
          path: .pio/build/cyd/firmware.bin
          if-no-files-found: error
