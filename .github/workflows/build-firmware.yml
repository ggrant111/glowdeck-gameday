name: Build GlowDeck firmware (CYD + ESP32-S3)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test verified NHL PP timeline and independent pulled-goalie indicators
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_pp_evidence.cpp -o /tmp/glowdeck-nhl-pp-evidence
          /tmp/glowdeck-nhl-pp-evidence
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_penalty_ledger.cpp -o /tmp/glowdeck-penalty-ledger
          /tmp/glowdeck-penalty-ledger
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_on_ice.cpp -o /tmp/glowdeck-on-ice
          /tmp/glowdeck-on-ice
      - name: Test PP_END full-strength club attribution on CYD and S3
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_powerplay_end_team.cpp -o /tmp/glowdeck-pp-end-team
          /tmp/glowdeck-pp-end-team
          python tests/test_powerplay_end_team_contract.py
      - name: Test PP2 session tracking, TV breaks, intermission, NHL goals and multi-device parity
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_powerplay_tracker2.cpp -o /tmp/glowdeck-pp2
          /tmp/glowdeck-pp2
          python tests/test_power_play_tracker2_contract.py
      - name: Test NHL polling and PP_END event log while WLED PP stays active
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_wled_restore_fetch_policy.cpp -o /tmp/glowdeck-wled-pp-fetch
          /tmp/glowdeck-wled-pp-fetch
          python tests/test_wled_restore_fetch_contract.py
      - name: Test live scorer ticker, penalty box and isolated LCD repaint
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_live_ticker.cpp -o /tmp/glowdeck-nhl-live-ticker
          /tmp/glowdeck-nhl-live-ticker
          python tests/test_nhl_live_ticker_contract.py
      - name: Test local calendar rollover
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_day_rollover.cpp -o /tmp/glowdeck-day-test
          /tmp/glowdeck-day-test
      - name: Test rear RGB LED patterns and active-low PWM
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_rear_led.cpp -o /tmp/glowdeck-rear-test
          /tmp/glowdeck-rear-test
      - name: Test NHL team palette and independent color diagnostic selection
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_team_palette.cpp -o /tmp/glowdeck-team-palette-test
          /tmp/glowdeck-team-palette-test
      - name: Test full daily follow capacity, NVS slot changes and CYD star targets
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_game_follow_policy.cpp -o /tmp/glowdeck-game-follow-test
          /tmp/glowdeck-game-follow-test
      - name: Test NHL scoreboard priority polling cadence
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_poll_cadence.cpp -o /tmp/glowdeck-poll-test
          /tmp/glowdeck-poll-test
      - name: Test conference records and pregame-to-live switching
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_conference_records.cpp -o /tmp/glowdeck-conference-test
          /tmp/glowdeck-conference-test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_detail_mode.cpp -o /tmp/glowdeck-detail-test
          /tmp/glowdeck-detail-test
      - name: Test NHL partial-input retry and backoff
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_nhl_fetch_policy.cpp -o /tmp/glowdeck-nhl-fetch-test
          /tmp/glowdeck-nhl-fetch-test
      - name: Test standings carousel ranks and slide order
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_standings_carousel.cpp -o /tmp/glowdeck-standings-test
          /tmp/glowdeck-standings-test
      - name: Test WLED celebration event masks, phases and NHL transitions
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_celebration_engine.cpp -o /tmp/glowdeck-celebration-test
          /tmp/glowdeck-celebration-test
      - name: Test Hue v2 light color conversion and event eligibility
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_hue_color_policy.cpp -o /tmp/glowdeck-hue
          /tmp/glowdeck-hue
      - name: Validate embedded web dashboard JavaScript
        run: python tests/check_web_ui.py
      - name: Validate USB Improv onboarding and QR fallback contract
        run: python tests/test_improv_qr_onboarding_contract.py
      - name: Verify Waveshare S3 active Phase 6C offline hotspot QR
        run: python tests/test_s3_offline_qr_contract.py
      - name: Test back-to-back CYD Improv serial RPCs using host-side simulation
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Itests/improv_stubs -Iinclude tests/test_gameday_improv_serial.cpp -o /tmp/gameday-improv-serial
          /tmp/gameday-improv-serial
      - name: Test arena web portal navigation, controls and centralized Test Lab
        run: python tests/test_web_portal_ux.py
      - name: Test CYD team-color gradient and RGB565 display bounds
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_team_gradient.cpp -o /tmp/glowdeck-gradient-test
          /tmp/glowdeck-gradient-test
      - name: Test bounded NHL event log and WLED delivery outcomes
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_game_event_log.cpp -o /tmp/glowdeck-game-event-test
          /tmp/glowdeck-game-event-test
      - name: Test S3 live audio resilience and Activity/serial audit parity
        run: python tests/test_s3_live_audio_reliability_contract.py
      - name: Test S3 live-goal horn outcome, WAV selection and sound diagnostics
        run: python tests/test_s3_live_goal_horn_contract.py
      - name: Test combined goal celebration plays and reports the saved horn
        run: python tests/test_full_celebration_audio_contract.py
      - name: Test independent S3 power-play WAV selection and live eligibility
        run: python tests/test_s3_power_play_sound_contract.py
      - name: Test S3 game-start WAV assignment
        run: python tests/test_s3_game_start_sound_contract.py
      - name: Test S3 game-finish WAV slot and live preview parity
        run: python tests/test_s3_game_finish_sound_contract.py
      - name: Test stable power-play event history
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_power_play_log_policy.cpp -o /tmp/glowdeck-pp-event-test
          /tmp/glowdeck-pp-event-test
      - name: Test all-live event admission, favorite teams and notification throttling
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_display_event_policy.cpp -o /tmp/glowdeck-display-policy
          /tmp/glowdeck-display-policy
      - name: Test nonblocking NHL event overlay queue and priority
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_event_overlay.cpp -o /tmp/glowdeck-overlay-test
          /tmp/glowdeck-overlay-test
      - name: Test live-first carousel and four-game summary grouping
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_live_carousel.cpp -o /tmp/glowdeck-live-carousel-test
          /tmp/glowdeck-live-carousel-test
      - name: Test five-game arming, event priority and per-controller WLED ownership
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_multi_game_arming.cpp -o /tmp/gameday-multi-arm
          /tmp/gameday-multi-arm
          python tests/test_multi_game_integration_contract.py
      - name: Test pause/resume carousel identity across NHL reordering
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_carousel_hold.cpp -o /tmp/glowdeck-carousel-hold
          /tmp/glowdeck-carousel-hold
          python tests/test_pause_and_pp_restore_contract.py
      - name: Test native S3 480x320 touch geometry and carousel controls
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_native_layout.cpp -o /tmp/glowdeck-s3-native-test
          /tmp/glowdeck-s3-native-test
      - name: Test S3 Phase 6B.2B and 6B.3 dynamic scoreboard, status evidence and navigation
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_broadcast_states.cpp -o /tmp/glowdeck-s3-broadcast-state-test
          /tmp/glowdeck-s3-broadcast-state-test
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_broadcast_data.cpp -o /tmp/glowdeck-s3-broadcast-data-test
          /tmp/glowdeck-s3-broadcast-data-test
          python tests/test_s3_broadcast_contract.py
      - name: Test S3 Phase 6B.4 partial SPI refresh, PSRAM and event recovery
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_broadcast_frame.cpp -o /tmp/glowdeck-s3-6b4-frame-test
          /tmp/glowdeck-s3-6b4-frame-test
          python tests/test_s3_phase6b4_contract.py
      - name: Test S3 Phase 6C broadcast pages, touch geometry and rollback
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase6c_pages.cpp -o /tmp/glowdeck-s3-6c-pages
          /tmp/glowdeck-s3-6c-pages
          python tests/test_s3_phase6c_contract.py
      - name: Test S3 Phase 6D release, 45k-cycle event endurance and graphics recovery
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase6d_stability.cpp -o /tmp/glowdeck-s3-6d-stability
          /tmp/glowdeck-s3-6d-stability
          python tests/test_s3_phase6d_release.py
      - name: Test S3 Phase 7A ES8311 speaker, 50-percent goal horn and isolated preview
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase7a_audio.cpp -o /tmp/glowdeck-s3-7a-audio
          /tmp/glowdeck-s3-7a-audio
          python tests/test_s3_phase7a_contract.py
      - name: Test S3 Phase 7A.1 speaker diagnostics, audible tone and codec readback
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase7a1_tone.cpp -o /tmp/glowdeck-s3-7a1-audio
          /tmp/glowdeck-s3-7a1-audio
          python tests/test_s3_phase7a1_diagnostics.py
      - name: Test S3 Phase 7A.2 audible horn harmonics and safe speaker volume
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase7a2_horn.cpp -o /tmp/glowdeck-s3-7a2-horn
          /tmp/glowdeck-s3-7a2-horn
          python tests/test_s3_phase7a2_contract.py
      - name: Test S3 Phase 7B WAV parsing, streaming, uploads and library isolation
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase7b_wav.cpp -o /tmp/glowdeck-s3-7b-wav
          /tmp/glowdeck-s3-7b-wav
          python tests/test_s3_phase7b_contract.py
      - name: Test S3 Phase 7C independent case LEDs and wiring safety
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_phase7c_case_led.cpp -o /tmp/glowdeck-s3-7c-case-led
          /tmp/glowdeck-s3-7c-case-led
          python tests/test_s3_phase7c_contract.py
      - name: Test WLED 8A discovery, eight slots and NHL eligibility
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_wled_phase8a.cpp -o /tmp/wled8a
          /tmp/wled8a
          python tests/test_wled_phase8a_contract.py
      - name: Test WLED 8B segment roles, native targeting and safe restoration
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_wled_phase8b_zones.cpp -o /tmp/wled8b
          /tmp/wled8b
          python tests/test_wled_phase8b_contract.py
      - name: Test WLED Phase 8C scene builder, scoped durations and persistence
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_wled_phase8c_scenes.cpp -o /tmp/wled8c
          /tmp/wled8c
          python tests/test_wled_phase8c_contract.py
      - name: Test WLED 8D DDP v1 packet, exclusive map, fallback and safety
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_wled_phase8d_ddp.cpp -o /tmp/wled8d
          /tmp/wled8d
          python tests/test_wled_phase8d_contract.py
      - name: Test WLED Phase 8E guided Quick Setup, safety and usability
        run: python tests/test_wled_phase8e_quick_setup_contract.py
      - name: Test S3 Phase 5 framebuffer and dirty-region geometry
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/test_s3_raster_geometry.cpp -o /tmp/glowdeck-s3-raster-test
          /tmp/glowdeck-s3-raster-test
          python tests/test_s3_framebuffer_contract.py
      - name: Generate native 480x320 arena background (stdlib only)
        run: python scripts/generate_s3_arena.py
      - name: Test S3 Phase 6B.1 native artwork, RGB565 colors and framebuffer
        run: python tests/test_s3_phase6_arena.py
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Install logo build dependencies
        run: pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Generate embedded NHL team logos
        run: python scripts/generate_logos.py
      - name: Test generated CYD/S3 official NHL logo assets and sprite renderer
        run: python tests/test_logo_assets.py
      - name: Compile ESP32 CYD firmware
        run: pio run -e cyd
      - name: Compile Waveshare ESP32-S3 3.5-inch firmware
        run: pio run -e s3_waveshare_35
      - name: Publish S3 Phase 6B.2A background preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glowdeck-s3-arena-6b2a-preview
          path: assets/s3_arena_live_480x320.png
          if-no-files-found: error
      - name: Publish CYD installable firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glowdeck-gameday-cyd-firmware
          path: .pio/build/cyd/firmware.bin
          if-no-files-found: error
      - name: Publish ESP32-S3 installable firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glowdeck-gameday-s3-waveshare-35-firmware
          path: .pio/build/s3_waveshare_35/firmware.bin
          if-no-files-found: error
