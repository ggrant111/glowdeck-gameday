name: Build CYD firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile ESP32 CYD firmware
        run: pio run -e cyd
      - name: Publish installable firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: glowdeck-gameday-cyd-firmware
          path: .pio/build/cyd/firmware.bin
          if-no-files-found: error
