; GlowDeck GameDay — dedicated ESP32-2432S028R / 2.8" CYD
; This config intentionally does not build any Fire TV or phone application.
[platformio]
default_envs = s3_waveshare_35

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  bblanchon/ArduinoJson@^6.21.5
  https://github.com/ricmoo/QRCode.git#eafbde494979abc2445c363cc2602230bcbe299c
build_flags =
  ; Arduino-ESP32 2.0.x default loopTask stack is 8192 bytes. 16KB protects
  ; deep TLS+ArduinoJson stack frames during NHL scoreboard downloads.
  -D ARDUINO_LOOP_STACK_SIZE=16384
  -D USER_SETUP_LOADED
  -D ILI9341_2_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D USE_HSPI_PORT
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SUPPORT_TRANSACTIONS

; Waveshare ESP32-S3-Touch-LCD-3.5, NOT the QSPI 3.5B variant.
; Separate build target: never flash a CYD .bin onto this board or vice versa.
[env:s3_waveshare_35]
; Rebuild the 480x320 RGB565 arena art automatically, using only Python stdlib.
; Pre-build hook prevents old embedded art from silently surviving git pull.
extra_scripts = pre:scripts/generate_s3_arena.py
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  bblanchon/ArduinoJson@^6.21.5
  jnthas/Improv WiFi Library@0.0.4
  https://github.com/ricmoo/QRCode.git#eafbde494979abc2445c363cc2602230bcbe299c
  bitbank2/AnimatedGIF@^2.2.0
  adafruit/Adafruit NeoPixel@^1.12.5
build_flags =
  -D ARDUINO_LOOP_STACK_SIZE=16384
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D GLOWDECK_WAVESHARE_S3
  ; Phase 6B arena scoreboard (set to 0 for an immediate old-UI fallback).
  ; This flag is S3-only and doesn't alter the CYD build.
  -D GLOWDECK_S3_PHASE6_LIVE=1
  ; Phase 6C full S3 broadcast pages (0 returns Stats/Games/Standings/
  ; Setup/Event/Empty screens to their Phase 5 appearance).
  -D GLOWDECK_S3_PHASE6C_UI=1
  ; TFT_eSPI 2.5.43 defaults to an undefined FSPI port on ESP32-S3.
  ; Explicitly select SPI2 (host 2), avoiding StoreProhibited at 0x00000010.
  -D USE_FSPI_PORT
  -D USER_SETUP_LOADED
  -D ST7796_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=2
  -D TFT_MOSI=1
  -D TFT_SCLK=5
  -D TFT_CS=-1
  -D TFT_DC=3
  -D TFT_RST=-1
  -D TFT_BL=6
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SUPPORT_TRANSACTIONS
  -D USE_FSPI_PORT
