; GlowDeck GameDay — dedicated ESP32-2432S028R / 2.8" CYD
; This config intentionally does not build any Fire TV or phone application.
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  ; Arduino-ESP32 2.0.x default loopTask stack is 8192 bytes. 16KB protects
  ; deep TLS+ArduinoJson stack frames during NHL scoreboard downloads.
  -D ARDUINO_LOOP_STACK_SIZE=16384
  -D USER_SETUP_LOADED
  -D ILI9341_2_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D USE_HSPI_PORT
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SUPPORT_TRANSACTIONS
